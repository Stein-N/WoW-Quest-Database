# Daily data update and release.
#
# Every day at 00:00 Europe/Berlin:
#   1. pull QuestieDB's master branch into vendor/QuestieDB and record the data version
#      (QuestieDB commit + latest VMangos snapshot) in data-version.json, commit to main
#   2. only if the data changed since the last release (QuestieDB commit, VMangos snapshot or
#      the project's own corrections in etl/corrections),
#      build the Docker image for linux/amd64 and linux/arm64, push it to GHCR (and Docker Hub,
#      see below) and publish a GitHub release (code changes alone do not release; they ship
#      with the next data update)
#
# Docker Hub (optional): set the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (access token with read/write) and optionally the variable DOCKERHUB_REPOSITORY
# (default <username>/wow-quest-database). The target repository must already exist and be
# PRIVATE - the image contains Blizzard map art. Otherwise Docker Hub is skipped with an error
# annotation (set the variable DOCKERHUB_ALLOW_PUBLIC=true to allow a public repository).
#
# Versions: the first release is 0.1.0, every following one increases the last part
# (0.1.1, 0.1.2, ...). Runs without new data are skipped; "Run workflow" with force=true
# releases anyway.

name: Daily data release

on:
  schedule:
    # GitHub cron is UTC: 22:00 UTC = 00:00 CEST (summer), 23:00 UTC = 00:00 CET (winter).
    # Both run; the "midnight in Berlin" check below lets exactly one of them continue.
    - cron: '0 22 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Release even if the data did not change
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: daily-release
  cancel-in-progress: false

env:
  IMAGE_NAME: wow-quest-database

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Only at midnight in Berlin
        id: gate
        run: |
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "00" ]; then
            echo "It is ${hour}:xx in Berlin - the other scheduled run handles today."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0
          submodules: true

      - name: Pull QuestieDB master and record data version
        if: steps.gate.outputs.run == 'true'
        id: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git submodule update --remote vendor/QuestieDB
          python3 etl/data_version.py data-version.json

          questie_short=$(git -C vendor/QuestieDB log -1 --format='%h')
          questie_date=$(git -C vendor/QuestieDB log -1 --format='%cs')
          snapshot=$(python3 -c "import json; print(json.load(open('data-version.json'))['vmangos']['snapshot'])")
          {
            echo "questie_rev=${questie_short} ${questie_date}"
            echo "questie_short=${questie_short}"
            echo "vmangos=${snapshot}"
          } >> "$GITHUB_OUTPUT"

          git add vendor/QuestieDB data-version.json
          if git diff --cached --quiet; then
            echo "Data unchanged."
          else
            git commit -m "Update data: QuestieDB ${questie_short} (${questie_date}), VMangos ${snapshot}"
            git push origin HEAD:main
          fi

      - name: Next version
        if: steps.gate.outputs.run == 'true'
        id: version
        run: |
          last=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$last" ]; then
            next=0.1.0
            changed=true
          else
            IFS=. read -r major minor patch <<< "${last#v}"
            next="${major}.${minor}.$((patch + 1))"
            # data changed = new QuestieDB commit, VMangos snapshot or own corrections
            # (questlines, client-cache texts) since the last release
            if git diff --quiet "${last}" HEAD -- data-version.json vendor/QuestieDB etl/corrections; then changed=false; else changed=true; fi
          fi
          if [ "${{ inputs.force }}" = "true" ]; then changed=true; fi
          echo "Last release: ${last:-none}, next: ${next}, changed: ${changed}"
          {
            echo "last=${last}"
            echo "next=${next}"
            echo "changed=${changed}"
            echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.changed == 'true'

      - name: Data report (fingerprint and uiMapId coverage, compared with the last release)
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LAST: ${{ steps.version.outputs.last }}
        run: |
          # only the report files of the data stage (cached for the image build below)
          docker buildx build . \
            --target report \
            --build-arg QUESTIE_REV="${{ steps.data.outputs.questie_rev }}" \
            --build-arg VMANGOS_SNAPSHOT="${{ steps.data.outputs.vmangos }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=local,dest=report
          mkdir -p dist previous
          cp report/uimap-report.json dist/uimap-report.json
          gzip -9c report/data-digest.json > dist/data-digest.json.gz

          # baseline: the files attached to the previous release (or a committed baseline)
          if [ -n "$LAST" ]; then
            gh release download "$LAST" --pattern uimap-report.json --pattern data-digest.json.gz --dir previous \
              || echo "Previous release ${LAST} has no report files."
            if [ ! -f previous/data-digest.json.gz ] && [ -f "etl/digests/${LAST}.json.gz" ]; then
              cp "etl/digests/${LAST}.json.gz" previous/data-digest.json.gz
            fi
          fi
          previous_uimap=""
          if [ -f previous/uimap-report.json ]; then previous_uimap="previous/uimap-report.json"; fi
          python3 etl/uimap_report.py dist/uimap-report.json ${previous_uimap:+"$previous_uimap"} > uimap-section.md
          cat uimap-section.md

      - name: Patch notes (CHANGELOG.json)
        if: steps.version.outputs.changed == 'true'
        run: |
          # hand-written notes from "unreleased" plus the data changes in plain words; committed
          # before the image is built, so the image shows its own notes
          args=(--digest report/data-digest.json --uimap dist/uimap-report.json)
          if [ -f previous/data-digest.json.gz ]; then args+=(--previous-digest previous/data-digest.json.gz); fi
          if [ -f previous/uimap-report.json ]; then args+=(--previous-uimap previous/uimap-report.json); fi
          python3 etl/changelog.py add "${{ steps.version.outputs.next }}" "${args[@]}"
          python3 etl/changelog.py render "${{ steps.version.outputs.next }}"
          git add CHANGELOG.json
          if ! git diff --cached --quiet; then
            git commit -m "Release v${{ steps.version.outputs.next }}: patch notes"
            git push origin HEAD:main
          fi

      - uses: docker/login-action@v3
        if: steps.version.outputs.changed == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Hub target (optional, private repositories only)
        if: steps.version.outputs.changed == 'true'
        id: dockerhub
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DH_REPO: ${{ vars.DOCKERHUB_REPOSITORY }}
          DH_ALLOW_PUBLIC: ${{ vars.DOCKERHUB_ALLOW_PUBLIC }}
        run: |
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then
            echo "Docker Hub: secrets not set, skipping."
            exit 0
          fi
          repo="${DH_REPO:-${DH_USER}/${IMAGE_NAME}}"
          repo="${repo,,}"

          # Docker Hub creates a missing repository on push with the account's default privacy,
          # which is often public. Only push into an existing private repository.
          jwt=$(curl -sS -H 'Content-Type: application/json' \
            -d "$(jq -n --arg u "$DH_USER" --arg p "$DH_TOKEN" '{username: $u, password: $p}')" \
            https://hub.docker.com/v2/users/login | jq -r '.token // empty')
          if [ -z "$jwt" ]; then
            echo "::error::Docker Hub login failed - check DOCKERHUB_USERNAME / DOCKERHUB_TOKEN. Skipping Docker Hub."
            exit 0
          fi
          code=$(curl -sS -o repo.json -w '%{http_code}' -H "Authorization: Bearer ${jwt}" \
            "https://hub.docker.com/v2/repositories/${repo}/")
          if [ "$code" = 404 ]; then
            echo "::error::Docker Hub repository ${repo} does not exist. Create it as a private repository first. Skipping Docker Hub."
            exit 0
          elif [ "$code" != 200 ]; then
            echo "::error::Docker Hub API returned HTTP ${code} for ${repo}. Skipping Docker Hub."
            exit 0
          fi
          if [ "$(jq -r '.is_private' repo.json)" != true ] && [ "$DH_ALLOW_PUBLIC" != true ]; then
            echo "::error::Docker Hub repository ${repo} is public, but the image contains Blizzard map art. Make it private (or set DOCKERHUB_ALLOW_PUBLIC=true). Skipping Docker Hub."
            exit 0
          fi
          echo "Docker Hub: pushing to ${repo} (private: $(jq -r '.is_private' repo.json))"
          {
            echo "enabled=true"
            echo "repo=docker.io/${repo}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: steps.dockerhub.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name for the release files
        if: steps.version.outputs.changed == 'true'
        id: release_image
        env:
          DOCKERHUB_REPO: ${{ steps.dockerhub.outputs.repo }}
          GHCR_IMAGE: ${{ steps.version.outputs.image }}
        run: |
          # docker-compose.yml and the image files use the Docker Hub repository when it is set up,
          # otherwise the GitHub container registry
          if [ -n "$DOCKERHUB_REPO" ]; then image="${DOCKERHUB_REPO#docker.io/}"; else image="$GHCR_IMAGE"; fi
          echo "Release image: ${image}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Build and push image (amd64 + arm64)
        if: steps.version.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            QUESTIE_REV=${{ steps.data.outputs.questie_rev }}
            VMANGOS_SNAPSHOT=${{ steps.data.outputs.vmangos }}
          # empty lines (Docker Hub disabled) are ignored
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.next }}
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('{0}:{1}', steps.dockerhub.outputs.repo, steps.version.outputs.next) || '' }}
            ${{ steps.dockerhub.outputs.enabled == 'true' && format('{0}:latest', steps.dockerhub.outputs.repo) || '' }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.next }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image files for the release
        if: steps.version.outputs.changed == 'true'
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            docker buildx build . \
              --platform "linux/${arch}" \
              --build-arg QUESTIE_REV="${{ steps.data.outputs.questie_rev }}" \
              --build-arg VMANGOS_SNAPSHOT="${{ steps.data.outputs.vmangos }}" \
              --cache-from type=gha \
              --tag "${{ steps.release_image.outputs.image }}:${{ steps.version.outputs.next }}" \
              --output "type=docker,dest=dist/${IMAGE_NAME}-${{ steps.version.outputs.next }}-${arch}.tar"
            gzip -9 "dist/${IMAGE_NAME}-${{ steps.version.outputs.next }}-${arch}.tar"
          done
          ls -lh dist

      - name: Write docker-compose.yml for the release
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.next }}
          IMAGE: ${{ steps.release_image.outputs.image }}
        run: |
          # app icon for ZimaOS/CasaOS, embedded so it needs no public URL (the repository is private)
          icon="data:image/png;base64,$(base64 -w0 docker/icon.png)"
          cat > dist/docker-compose.yml <<EOF
          # WoW Quest Database ${VERSION}
          #
          # Start (or update to this version):  docker compose up -d
          # The site is then served on http://<server>:8080 (change the left port to taste).
          #
          # Image: ${IMAGE}:${VERSION}. For a private repository log in once with a token
          # (docker login) before the first start.
          # Alternatively load the image file from this release first (no login needed):
          #   gunzip -c ${IMAGE_NAME}-${VERSION}-amd64.tar.gz | docker load
          name: wow-quest-database
          services:
            wow-quest-database:
              image: ${IMAGE}:${VERSION}
              container_name: wow-quest-database
              ports:
                - "8080:80"
              restart: unless-stopped

          # App metadata for ZimaOS / CasaOS (title, icon, web UI port)
          x-casaos:
            architectures:
              - amd64
              - arm64
            main: wow-quest-database
            author: Stein-N
            category: Utilities
            title:
              en_US: WoW Quest Database
            tagline:
              en_US: Quests, NPCs, objects and items for WoW Classic Era and WoW Forever
            description:
              en_US: Quest database for WoW Classic Era and WoW Forever with maps, questlines and Lua export.
            icon: ${icon}
            index: /
            port_map: "8080"
            scheme: http
            version: "${VERSION}"
          EOF
          docker compose -f dist/docker-compose.yml config --quiet
          cat dist/docker-compose.yml

      - name: Publish GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.next }}
          LAST: ${{ steps.version.outputs.last }}
          IMAGE: ${{ steps.release_image.outputs.image }}
          GHCR_IMAGE: ${{ steps.version.outputs.image }}
        run: |
          other=""
          if [ "$IMAGE" != "$GHCR_IMAGE" ]; then
            other="Also in the GitHub container registry: \`docker pull ${GHCR_IMAGE}:${VERSION}\`"
          fi
          questie=$(python3 -c "import json; q=json.load(open('data-version.json'))['questie']; print(f\"[{q['commit'][:7]}](https://github.com/Questie/QuestieDB/commit/{q['commit']}) ({q['date']}) {q['subject']}\")")
          vmangos=$(python3 -c "import json; v=json.load(open('data-version.json'))['vmangos']; print(f\"{v['snapshot']} ({v['published']})\")")
          {
          cat <<EOF
          Data: QuestieDB ${questie} · VMangos ${vmangos}

          EOF
          # the same patch notes the website shows (website, data, technical details)
          python3 etl/changelog.py render "${VERSION}"
          cat uimap-section.md
          cat <<EOF
          ## Install

          With the attached \`docker-compose.yml\` (image \`${IMAGE}:${VERSION}\`, port 8080):

          \`\`\`sh
          docker compose up -d
          \`\`\`

          The image is pulled from the registry (for a private repository log in once with \`docker login\`).
          Without registry access, load the image file first (\`amd64\` for PCs/servers, \`arm64\` for
          e.g. Raspberry Pi), then run \`docker compose up -d\` as above:

          \`\`\`sh
          gunzip -c ${IMAGE_NAME}-${VERSION}-amd64.tar.gz | docker load
          \`\`\`

          Without Compose: \`docker run -d --name wow-quest-database -p 8080:80 --restart unless-stopped ${IMAGE}:${VERSION}\`

          ${other}
          EOF
          } > notes.md

          gh release create "v${VERSION}" dist/*.tar.gz dist/docker-compose.yml dist/uimap-report.json dist/data-digest.json.gz \
            --target "$(git rev-parse HEAD)" \
            --title "v${VERSION}" \
            --notes-file notes.md
