# Publishes the site to GitHub Pages under the custom domain in CNAME (data.morthen.net).
#
# Runs after every daily release run (which may have pulled new QuestieDB data), on pushes to
# main and on demand. The site is built by the Dockerfile's `pages` stage, so it is identical
# to the one in the Docker image and reuses the release workflow's build cache.
#
# Note: GitHub Pages sites are public, also for private repositories. This includes the map
# images extracted from the WoW clients (web/static/maps).
#
# One-time setup: Settings -> Pages -> Source "GitHub Actions"; custom domain data.morthen.net
# (DNS: CNAME record data -> stein-n.github.io); "Enforce HTTPS" once the certificate is issued.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Daily data release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # after a release run only when it succeeded
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # main, not the triggering commit: a release run pushes data and patch-note commits
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true

      - name: Data version
        id: data
        run: |
          questie_short=$(git -C vendor/QuestieDB log -1 --format='%h')
          questie_date=$(git -C vendor/QuestieDB log -1 --format='%cs')
          snapshot=$(python3 -c "import json; print(json.load(open('data-version.json'))['vmangos']['snapshot'])")
          {
            echo "questie_rev=${questie_short} ${questie_date}"
            echo "vmangos=${snapshot}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build site
        run: |
          docker buildx build . \
            --target pages \
            --build-arg QUESTIE_REV="${{ steps.data.outputs.questie_rev }}" \
            --build-arg VMANGOS_SNAPSHOT="${{ steps.data.outputs.vmangos }}" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --output type=local,dest=site
          cp CNAME site/CNAME
          du -sh site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
