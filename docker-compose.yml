# Home server deployment:
#   git submodule update --init
#   QUESTIE_REV="$(git -C vendor/QuestieDB log -1 --format='%h %cs')" docker compose up -d --build
# Site: http://<server>:8080
services:
  wow-quest-database:
    build:
      context: .
      args:
        QUESTIE_REV: ${QUESTIE_REV:-}
    image: wow-quest-database:latest
    container_name: wow-quest-database
    ports:
      - "8080:80"
    restart: unless-stopped

# App metadata for ZimaOS / CasaOS (title, icon, web UI port). The icon is embedded
# (docker/icon.png) because the repository is private and has no public URL.
x-casaos:
  architectures:
    - amd64
    - arm64
  main: wow-quest-database
  author: Stein-N
  category: Utilities
  title:
    en_US: Forever Database
  tagline:
    en_US: Quests, NPCs, objects and items for WoW Forever
  description:
    en_US: Quest database for WoW Forever with maps, questlines and Lua export.
  icon: data:image/png;base64,
  index: /
  port_map: "8080"
  scheme: http
